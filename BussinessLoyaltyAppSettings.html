<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BussinessLoyaltyAppSettings</title>
  <style>
    body{
  display: flex;
  padding-bottom: 60px;
}
html, body{ 
  margin: 0;
  padding: 0;
}
.content{
  background-color: blue;
  min-height: 100vh;
  width: 100%;
}

.toolbar{
  position: fixed;
  bottom: 1px;
  left: 0;
  border: 2px solid black;
  width: 100%;
  display: flex;
  justify-content: space-around;
  align-items: center;
  height: 60px;
  background-color: #f0f0f0;
  border-top: 1px solid #ccc;
}

.toolbar button {
            background: none;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            font-size: 16px;
}

.tptoolbar {
  position: fixed;
  top: 1px;
  right: 1px;
  display: flex;
  flex-direction: column;
}

.tptoolbar button{
  height: 47px;
  width: 47px;
}

.settings-btn{
  color: blue;
}

.centered{
  text-align: center;
}

.white{
  color:white;
}

.settingopt {
  display: flex;
  flex-direction: column;
  gap: .5px;
}

.settingopt button {
  width: 100%;
  background: none;
  border: none;
  padding: 0;
}

.settingopt div {
  border: 1px solid grey;
  display: flex;
  align-items: center;
  height: 80px;
  padding-left: 16px;
}
</style>
</head>
<body>
    <div class="content">
      <div class="tptoolbar">
       <button>Cart</button></button>
       <button>5215~</button>
      </div><br><br><br>
        <h1 class="centered white">User Settings</h1>
        <p class="centered white">Adjust your user settings below
        </p>
        <div class="settingopt white">
          <button><div class="white">Profile </div></button>
          <button><div class="white">Notifications </div></button>
          <button><div class="white">Display </div></button>
          <button><div class="white">Phone Number </div></button>
          <button><div class="white">Payment Methods </div></button>
          <button><div class="white">Settings</div></button>
        </div>
      <div class="toolbar">
        <a href="/BussinessLoyaltyAppHome.html"><button class="home-btn">Home</button></a>
        <a href="/BussinessLoyaltyAppCart.html"><button class="shopping-cart-btn"> Cart</button></a>
        <a href="/BussinessLoyaltyAppCode.html"><button class="qr-code-btn">QR Code</button></a>
        <a href="/BussinessLoyaltyAppRewards.html"><button class="rewards-btn">Rewards</button></a>
        <a><button class="settings-btn">Settings</button></a>
    </div>  
    </div>

</html>

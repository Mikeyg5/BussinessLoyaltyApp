<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BussinessLoyaltyAppHome</title>
  <style>
    body{
  display: flex;
  padding-bottom: 60px;
}
html, body{ 
  margin: 0;
  padding: 0;
}
.content{
  background-color: blue;
  min-height: 100vh;
  width: 100%;
}

.toolbar{
  position: fixed;
  bottom: 1px;
  left: 0;
  border: 2px solid black;
  width: 100%;
  display: flex;
  justify-content: space-around;
  align-items: center;
  height: 60px;
  background-color: #f0f0f0;
  border-top: 1px solid #ccc;
}

.toolbar button {
            background: none;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            font-size: 16px;
}

.tptoolbar {
  position: fixed;
  top: 1px;
  right: 1px;
  display: flex;
  flex-direction: column;
}

.tptoolbar button{
  height: 47px;
  width: 47px;
}

.home-btn{
  color: blue;
}
.centered{
  text-align: center;
}
.border {
  border: 2px solid black;
}

.content2 {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  column-gap: 30px;
  row-gap: 10px;
  margin: 40px;
}

.white{
  color:white;
}

.weekly{
  height: 150px;
  width:150px;
}
</style>
</head>
<body>
    <div class="content">
      <div class="tptoolbar">
       <button>Cart</button></button>
       <button>5215~</button>
      </div><br><br><br>
        <h1 class="centered white">This weeks deals</h1>
        <h3 class = "centered white">Check out our Weekly Deals
        </h3>
        <div class="content2">
        <button><div class="border weekly">Cacio e Pepe</div></button>
        <button><div class="border weekly">Pizza Margherita</div></button>
        <button><div class="border weekly">Tuscan Bistecca</div></button>
        <button><div class="border weekly">Gelato</div></button>
        <button><div class="border weekly">Risotto alla Milanese</div></button>
        <button><div class="border weekly">Tiramisu</div></button>
        </div>
      <div class="toolbar">
        <a><button class="home-btn">Home</button></a>
        <a href="/BussinessLoyaltyAppCart.html"><button class="shopping-cart-btn"> Cart</button></a>
        <a href="/BussinessLoyaltyAppCode.html"><button class="qr-code-btn">QR Code</button></a>
        <a href="/BussinessLoyaltyAppRewards.html"><button class="rewards-btn">Rewards</button></a>
        <a href="BussinessLoyaltyAppSettings.html"><button class="settings-btn">Settings</button></a>
    </div>  
    </div>
</body>
</html>
